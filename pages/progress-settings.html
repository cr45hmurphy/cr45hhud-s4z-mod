<!doctype html><html lang="en" tabindex="0" class="settings-page" data-settings-key="cohesive-progress-settings-v1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ride Progress Bar - Settings</title><script src="/pages/src/preloads.js"></script><link rel="stylesheet" href="/pages/css/common.css"><link rel="stylesheet" href="./settings.css"><script type="module" src="./settings.mjs"></script></head><body data-style="progress"><div id="titlebar"><header><div class="logo"><img src="/pages/images/icon128.png"/></div><div class="title">Ride Progress Bar - Settings</div><div class="filler"></div><div class="buttons"><div title="Minimize" class="button minimize electron-only"><ms>minimize</ms></div><div title="Close this window" class="button close electron-only"><ms>close</ms></div></div></header></div><div id="settings"><form id="options" class="section"><div class="title">Window</div><label><key>Theme:</key><select is="sauce-theme" override></select></label><label title="Scales all text. Resize the window to fit; text size does not follow window size."><key>Text size:</key><input type="range" name="fontScale" min="0.5" max="2" step="0.1"><input type="number" name="fontScale" min="0.5" max="2" step="0.1" style="--size:5"></label><label><key>Solid background:</key><input type="checkbox" name="solidBackground"></label><label><key>Background color:</key><input type="color" name="backgroundColor" data-depends-on="solidBackground"><input type="number" name="backgroundAlpha" title="Background opacity (%)" min="0" max="100" style="--size:5" data-depends-on="solidBackground">%</label><label><key>Units:</key><select name="units"><option value="metric">Kilometers</option><option value="imperial">Miles</option></select></label><div class="title">Bar</div><label><key>Style:</key><select name="density"><option value="standard">Full bar</option><option value="compact">Compact bar (one row)</option><option value="line">Thin line</option></select></label><label data-show-when="density:line"><key>Line layout:</key><select name="lineLayout"><option value="bare">Line only, no labels</option><option value="ends">Labels beside the line</option><option value="above">Labels on their own row</option><option value="raised">Labels beside, raised segment markers</option></select></label><label title="The bar grows if its text needs more room." data-show-when="density:standard|compact"><key>Minimum bar height (px):</key><input type="range" name="barThickness" min="2" max="40" step="1"><input type="number" name="barThickness" min="2" max="40" step="1" style="--size:5"></label><label data-show-when="density:standard|compact"><key>Corners:</key><select name="cornerStyle"><option value="square">Square</option><option value="soft">Slightly rounded</option><option value="rounded">Rounded</option></select></label><label><key>Your position:</key><select name="riderMarker"><option value="bar">Bar</option><option value="notch">Notch (arrow above)</option><option value="none">None (end of the fill)</option></select></label><label title="Hatched section before the route starts, or the connector between laps."><key>Show lead-in:</key><input type="checkbox" name="showLeadIn"></label><div class="title" data-show-when="density:standard|compact || density:line lineLayout:ends|above|raised">Labels</div><p data-show-when="density:standard">Shown above or below the bar.</p><p data-show-when="density:compact">Shown inside the bar.</p><p data-show-when="density:line lineLayout:ends|raised">Shown beside the line.</p><p data-show-when="density:line lineLayout:above">Shown on their own row.</p><label data-show-when="density:standard|compact || density:line lineLayout:ends|above|raised"><key>Left label:</key><select name="textLeft"><option value="name">Route name</option><option value="next">Next segment</option><option value="lap">Lap</option><option value="none">Nothing</option></select></label><label title="Centered between the left and right labels." data-show-when="density:standard|compact || density:line lineLayout:ends|above|raised"><key>Middle label:</key><select name="textMiddle"><option value="name">Route name</option><option value="next">Next segment</option><option value="lap">Lap</option><option value="none">Nothing</option></select></label><label data-show-when="density:standard|compact || density:line lineLayout:ends|above|raised"><key>Right label:</key><select name="textRight"><option value="name">Route name</option><option value="next">Next segment</option><option value="lap">Lap</option><option value="none">Nothing</option></select></label><label data-show-when="density:standard || density:line lineLayout:above"><key>Label row:</key><select name="textPosition"><option value="above">Above the bar</option><option value="below">Below the bar</option><option value="split">Split: left label above, right label below</option></select></label><label title="When a segment is close, or while you ride one, a Route name label shows the next segment instead." data-show-when="density:standard|compact || density:line lineLayout:ends|above|raised"><key>Swap route name for next segment:</key><input type="checkbox" name="swapToNext"></label><label data-show-when="swapToNext:true"><key>Swap when within:</key><input type="number" name="swapDistance" min="0.2" max="10" step="0.1" style="--size:5" data-depends-on="swapToNext"> <span data-unit-label>km</span></label><label title="Always at the far right." data-show-when="density:standard|compact || density:line lineLayout:ends|above|raised"><key>Progress readout:</key><select name="distanceDisplay"><option value="km">Distance left</option><option value="percent">Percent complete</option><option value="both">Distance left and percent</option><option value="none">Nothing</option></select></label><label title="A dark edge around text, so it reads over bright scenery." data-show-when="density:standard|compact || density:line lineLayout:ends|above|raised"><key>Text outline:</key><select name="textOutline"><option value="off">None</option><option value="light">Light</option><option value="normal">Medium</option><option value="heavy">Heavy</option></select></label><div class="title">Segments</div><label title="Colored marks on the bar where segments start and end."><key>Segment markers:</key><input type="checkbox" name="showIndicators"></label><label title="Sprint green, climb red, loop orange." data-show-when="showIndicators:true"><key>Marker colors:</key><select name="segmentPalette"><option value="game">Zwift colors</option><option value="lifted">Lighter</option><option value="safe">Colorblind-friendly</option></select></label><label title="Loop segments often cover a whole lap."><key>Include loops:</key><input type="checkbox" name="showLoops"></label><label title="The next-segment label pulses in the last 500 m, turns solid while you ride the segment, and its marker brightens."><key>Highlight upcoming segment:</key><input type="checkbox" name="approachCue"></label><label data-show-when="textLeft:next density:standard|compact || textLeft:next density:line lineLayout:ends|above|raised || textMiddle:next density:standard|compact || textMiddle:next density:line lineLayout:ends|above|raised || textRight:next density:standard|compact || textRight:next density:line lineLayout:ends|above|raised || swapToNext:true density:standard|compact || swapToNext:true density:line lineLayout:ends|above|raised"><key>Next segment shows:</key><select name="segmentText"><option value="type">Type (Sprint, Climb, Loop)</option><option value="name">Full segment name</option></select></label><label data-show-when="textLeft:next density:standard|compact || textLeft:next density:line lineLayout:ends|above|raised || textMiddle:next density:standard|compact || textMiddle:next density:line lineLayout:ends|above|raised || textRight:next density:standard|compact || textRight:next density:line lineLayout:ends|above|raised || swapToNext:true density:standard|compact || swapToNext:true density:line lineLayout:ends|above|raised"><key>Next segment color:</key><select name="nextColor"><option value="segment">Segment color</option><option value="white">White</option></select></label><p>Segment types come from each segment's name and loop flag. The bar shows the current lap, not a whole multi-lap event.</p></form><section class="section" hidden><div id="fields" hidden></div></section></div></body></html>
